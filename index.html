<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Prototype Development: Promoting education, science and art">
    <title>amoderndev</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #e0e0e0;
            background: #0d1117;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        
        main {
            max-width: 600px;
            text-align: center;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 12px;
            margin: 0 auto 2rem;
            display: block;
        }
        
        h1 {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: #fff;
            letter-spacing: -0.01em;
        }
        
        p {
            font-size: 1.125rem;
            color: #8b949e;
            margin-bottom: 2rem;
            line-height: 1.7;
        }
        
        a {
            color: #58a6ff;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        a:hover {
            color: #79c0ff;
        }
        
        @media (max-width: 640px) {
            .logo {
                width: 100px;
                height: 100px;
            }
            
            h1 {
                font-size: 1.75rem;
            }
            
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <img src="https://avatars.githubusercontent.com/u/176243283?s=200&v=2" alt="AModernDev" class="logo">
        <h1>AModernDev</h1>
        <p>Prototype Development: Promoting education, science and art through insightful writing, recommendations, and tools that add real value.</p>
        <a href="https://github.com/amoderndev" target="_blank" rel="noopener">github.com/amoderndev</a>
    </main>
</body>
</html>
